name: Publish Ads Wizard v71 (ZIP and .skill)

on:
  push:
    paths:
      - '.github/workflows/release-ads-wizard-v71.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify edit-first rules and package both formats
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_edit_asset_role_audit_v71.py' -v
          python -m unittest discover -s tests -p 'test_icon_scene_v70.py' -v
          python scripts/edit_asset_role_audit_v71.py examples/edit-first-v71/shot-plan.json --report "$RUNNER_TEMP/v71-edit-audit.json"
          target="$RUNNER_TEMP/ads-wizard-dist/ads-wizard"
          mkdir -p "$target"
          cp README.md SKILL.md "$target/"
          cp -R assets examples references scripts starter templates tests "$target/"
          find "$target" -type d -name __pycache__ -prune -exec rm -rf '{}' +
          find "$target" -type f -name '*.pyc' -delete
          total="$(find "$target" -type f | wc -l | tr -d ' ')"
          test "$total" = '560'
          grep -q '^name: ads-wizard$' "$target/SKILL.md"
          grep -q 'Edit first' "$target/SKILL.md"
          test -f "$target/assets/branding/ads-wizard-icon.png"
          test -f "$target/references/152-edit-first-icon-polish-v71.md"
          test -f "$target/references/153-v71-user-film-evidence.md"
          test -f "$target/scripts/edit_asset_role_audit_v71.py"
          test -f "$target/examples/edit-first-v71/shot-plan.json"
          (cd "$RUNNER_TEMP/ads-wizard-dist" && zip -qr "$GITHUB_WORKSPACE/Ads-Wizard-v71.zip" ads-wizard)
          unzip -tq "$GITHUB_WORKSPACE/Ads-Wizard-v71.zip"
          cp "$GITHUB_WORKSPACE/Ads-Wizard-v71.zip" "$GITHUB_WORKSPACE/ads-wizard-v71.skill"
          cmp "$GITHUB_WORKSPACE/Ads-Wizard-v71.zip" "$GITHUB_WORKSPACE/ads-wizard-v71.skill"
      - name: Publish v71 release ZIP and .skill
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v71 >/dev/null 2>&1; then
            gh release upload v71 Ads-Wizard-v71.zip ads-wizard-v71.skill --clobber
          else
            gh release create v71 Ads-Wizard-v71.zip ads-wizard-v71.skill \
              --target "$GITHUB_SHA" \
              --title "Ads Wizard v71 — Edit first, icons last" \
              --notes "Editorial correction: UI component motion, typography, transitions and professional design come before icons. Icons are finishing polish on buttons, cards, tabs and statuses, not scene heroes. Includes a storyboard warning tool, actual observed film case, and preserves prior editors/SFX/branding."
          fi
