name: Publish Motion Director v68

on:
  push:
    paths:
      - '.github/workflows/release-v68.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package and verify v68 skill and pictorial assets
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/md-release/motion-director"
          mkdir -p "$target"
          cp README.md SKILL.md "$target/"
          cp -R assets examples references scripts starter templates tests "$target/"
          count="$(find "$target" -type f | wc -l | tr -d ' ')"
          test "$count" = '531'
          test -f "$target/examples/asset-first-v68/scene.json"
          test -f "$target/examples/asset-first-v68/illustrations/hero-shield.png"
          test -f "$target/scripts/asset_scout_v68.py"
          (cd "$RUNNER_TEMP/md-release" && zip -qr "$GITHUB_WORKSPACE/motion-director-v68.zip" motion-director)
          unzip -tq "$GITHUB_WORKSPACE/motion-director-v68.zip"
      - name: Publish GitHub Release v68
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v68 >/dev/null 2>&1; then
            gh release upload v68 motion-director-v68.zip --clobber
          else
            gh release create v68 motion-director-v68.zip \
              --target "$GITHUB_SHA" \
              --title "Motion Director v68 — Asset-first visual production" \
              --notes "Full 531-file skill with five original illustrated SVG and PNG hero assets, a real compositor example, asset-scout CLI, provenance and SVG safety checks, and anti-morphed-PowerPoint direction. Previous editor and sound tools preserved."
          fi
