<!doctype html><meta charset="utf-8"><canvas></canvas><script>
'use strict';let c=document.querySelector('canvas'),gl,pr,meshes={},plan;
const vs=`#version 300 es
precision highp float;layout(location=0) in vec3 p;layout(location=1) in vec3 n;layout(location=2) in vec3 pos;layout(location=3) in vec3 ang;layout(location=4) in float sz;uniform mat4 vp;out vec3 N;out vec3 P;
vec3 rot(vec3 v,vec3 a){float c=cos(a.x),s=sin(a.x);v.yz=mat2(c,s,-s,c)*v.yz;c=cos(a.y);s=sin(a.y);v.xz=mat2(c,-s,s,c)*v.xz;c=cos(a.z);s=sin(a.z);v.xy=mat2(c,s,-s,c)*v.xy;return v;}
void main(){P=rot(p*sz,ang)+pos;N=rot(n,ang);gl_Position=vp*vec4(P,1.);}`;
const fs=`#version 300 es
precision highp float;in vec3 N;in vec3 P;out vec4 color;uniform vec3 eye;uniform vec3 tint;uniform float rough;uniform float phase;
float panel(vec3 r,vec3 d,float w){return pow(max(dot(r,normalize(d)),0.),w);}
void main(){vec3 n=normalize(N),v=normalize(eye-P),r=reflect(-v,n);float q=mix(95.,7.,rough);float a=panel(r,vec3(cos(phase),.75,sin(phase)),q),b=panel(r,vec3(-.8,.05,.7),q*.6);float strip=pow(max(0.,1.-abs(r.y-.25)),18.)*smoothstep(-.7,.4,r.x);float rim=pow(1.-max(dot(n,v),0.),3.);vec3 lit=tint*(.15+.12*max(n.y,0.))+vec3(.98,.96,1.)*a*1.9+vec3(.35,.4,.85)*b+vec3(.67,.71,.85)*strip*.65+rim*.13;lit*=exp(-length(P-eye)*.012);color=vec4(pow(clamp(lit,0.,1.),vec3(.82)),1.);}`;
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const sub=(a,b)=>a.map((v,i)=>v-b[i]),dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>a.map(v=>v/Math.hypot(...a));
function mul(a,b){let c=[];for(let i=0;i<4;i++)for(let j=0;j<4;j++)c.push(a[j]*b[i*4]+a[j+4]*b[i*4+1]+a[j+8]*b[i*4+2]+a[j+12]*b[i*4+3]);return c;}
function view(e,t){let z=norm(sub(e,t)),x=norm(cross([0,1,0],z)),y=cross(z,x);return[x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1];}
function proj(fov,aspect){let f=1/Math.tan(fov*Math.PI/360),n=.1,F=200;return[f/aspect,0,0,0,0,f,0,0,0,0,(F+n)/(n-F),-1,0,0,2*F*n/(n-F),0];}
const ease=t=>t*t*(3-2*t),mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);function rand(i,s){let x=Math.sin(i*127.1+s*311.7)*43758.5453;return x-Math.floor(x)}
function shape(k,i,N,s){let u=(i+.5)/N,a=i*2.399963229728653,r=s.radius||3,h=s.height||8;switch(k){case'grid':{let cols=Math.ceil(Math.sqrt(N)),rows=Math.ceil(N/cols);return[((i%cols)/Math.max(1,cols-1)-.5)*2*r,(.5-Math.floor(i/cols)/Math.max(1,rows-1))*h,0];}case'helix':{let a=u*Math.PI*2*(s.turns||4)+(i%3)*2*Math.PI/3;return[Math.cos(a)*r,(.5-u)*h,Math.sin(a)*r];}case'torus':{let b=a*1.618,R=r+(s.tube||.65)*Math.cos(b);return[R*Math.cos(a),(s.tube||.65)*Math.sin(b),R*Math.sin(a)];}case'tunnel':{let per=s.per_ring||48,ring=Math.floor(i/per),total=Math.ceil(N/per),a=i%per/per*Math.PI*2;return[r*Math.cos(a),r*Math.sin(a),(ring-(total-1)/2)*h/Math.max(1,total-1)];}case'sphere':{let y=1-2*u,rr=Math.sqrt(1-y*y);return[r*rr*Math.cos(a),r*y,r*rr*Math.sin(a)];}case'scatter':return[(rand(i,1)-.5)*r*3,(rand(i,2)-.5)*h*1.6,(rand(i,3)-.5)*r*3];case'custom':return s.points[i];default:throw Error('Unknown layout '+k);}}
function setup(p,g){plan=p;c.width=p.width;c.height=p.height;gl=c.getContext('webgl2',{antialias:true,preserveDrawingBuffer:true,alpha:false});if(!gl)throw Error('WebGL2 unavailable');pr=gl.createProgram();gl.attachShader(pr,shader(gl.VERTEX_SHADER,vs));gl.attachShader(pr,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pr));gl.useProgram(pr);gl.enable(gl.DEPTH_TEST);gl.clearColor(.011,.012,.022,1);for(const[ch,m]of Object.entries(g)){let vao=gl.createVertexArray();gl.bindVertexArray(vao);let buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(m.vertices),gl.STATIC_DRAW);for(let j=0;j<2;j++){gl.enableVertexAttribArray(j);gl.vertexAttribPointer(j,3,gl.FLOAT,false,24,j*12);}let inst=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,inst);for(let j=2;j<5;j++){gl.enableVertexAttribArray(j);gl.vertexAttribPointer(j,j===4?1:3,gl.FLOAT,false,28,(j-2)*12);gl.vertexAttribDivisor(j,1);}meshes[ch]={vao,inst,verts:m.vertices.length/6};}return gl.getParameter(gl.RENDERER);}
function render(frame){let s=plan.scenes.find(s=>frame>=s.start&&frame<s.end);if(!s)throw Error('Uncovered frame');let t=(frame-s.start)/Math.max(1,s.end-s.start-1),e=ease(t),eye=mix(s.eye_from,s.eye_to,e),target=mix(s.target_from||[0,0,0],s.target_to||[0,0,0],e);gl.viewport(0,0,c.width,c.height);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);let loc=n=>gl.getUniformLocation(pr,n);gl.uniformMatrix4fv(loc('vp'),false,new Float32Array(mul(proj(s.fov||42,c.width/c.height),view(eye,target))));gl.uniform3fv(loc('eye'),eye);gl.uniform3fv(loc('tint'),s.tint||[.42,.45,.58]);gl.uniform1f(loc('rough'),s.roughness??.22);gl.uniform1f(loc('phase'),(s.light_phase||0)+t*(s.light_sweep??2));let groups={};for(let i=0;i<s.count;i++){let ch=s.glyphs[i%s.glyphs.length],a=shape(s.layout,i,s.count,s),b=s.to_layout?shape(s.to_layout,i,s.count,s):a,p=mix(a,b,e),spin=(s.spin||0)*t,rx=(s.random_rotation||0)*(rand(i,4)-.5),ry=(s.random_rotation||0)*(rand(i,5)-.5)+spin,rz=(s.random_rotation||0)*(rand(i,6)-.5);if(s.orbit){let co=Math.cos(spin),si=Math.sin(spin);p=[p[0]*co+p[2]*si,p[1],-p[0]*si+p[2]*co];}let size=(s.size||.3)*(1+(s.size_variation||0)*(rand(i,7)-.5));(groups[ch]??=[]).push(...p,rx,ry,rz,size);}for(let[ch,buf]of Object.entries(groups)){let m=meshes[ch];gl.bindVertexArray(m.vao);gl.bindBuffer(gl.ARRAY_BUFFER,m.inst);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(buf),gl.DYNAMIC_DRAW);gl.drawArraysInstanced(gl.TRIANGLES,0,m.verts,buf.length/7);}gl.finish();let err=gl.getError();if(err)throw Error('WebGL error '+err);return c.toDataURL('image/png').split(',')[1];}
</script>
